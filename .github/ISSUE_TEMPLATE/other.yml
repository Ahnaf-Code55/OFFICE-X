name: Something else
description: Anything that is not a bug report or a feature request.
title: "[Other]: "
body:
  - type: markdown
    attributes:
      value: |
        Blank issues are turned off, so this is the catch-all. If it is a bug or a
        feature request, please back out and pick that template instead: they ask for
        the details that make the report actionable.

        For questions and ideas, include the context and expected outcome below.
        Do not report security vulnerabilities in a public issue; contact the OQVIAN
        project maintainers through a private security channel instead.
  - type: textarea
    id: details
    attributes:
      label: What is this about?
      description: Give us enough context to act on it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OFFICE-X version (if relevant)
      placeholder: "0.4.6"
    validations:
      required: false
